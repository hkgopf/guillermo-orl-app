<script>
(function(){
  var meta=JSON.parse(document.getElementById('meta').textContent);
  var b64=document.getElementById('payload').textContent.trim();
  function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  async function abrir(clave){
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(clave),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(meta.salt),iterations:meta.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var plano=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(meta.nonce)},key,u8(b64));
    var ds=new DecompressionStream('gzip');
    var stream=new Blob([plano]).stream().pipeThrough(ds);
    var html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }
  var f=document.getElementById('f'),e=document.getElementById('e'),k=document.getElementById('k'),r=document.getElementById('r');
  f.addEventListener('submit',function(ev){ev.preventDefault();e.textContent='';document.getElementById('b').textContent='Abriendo…';
    abrir(k.value).then(function(){try{if(r.checked)localStorage.setItem('orl.clave',k.value);}catch(x){}})
    .catch(function(){e.textContent='Contraseña incorrecta.';document.getElementById('b').textContent='Abrir';});
  });
  try{var g=localStorage.getItem('orl.clave');if(g){k.value=g;abrir(g).catch(function(){localStorage.removeItem('orl.clave');k.value='';});}}catch(x){}
})();
</script>
